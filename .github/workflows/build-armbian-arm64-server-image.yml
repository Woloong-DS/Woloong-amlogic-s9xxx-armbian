env:
  TZ: Etc/UTC
  ROOTFS_SCRIPT: compile-kernel/tools/script/docker/build_armbian_rootfs_file.sh

jobs:
  check:  # 新增：定时检查 Woloong-kernel 是否有比上次镜像更新的内核，没有就跳过整轮构建
    runs-on: ubuntu-latest  # 轻量任务，检查只需几秒
    outputs:
      build: ${{ steps.chk.outputs.build }}
      kernel: ${{ steps.chk.outputs.kernel }}
    steps:
      - name: Check for newer kernel in Woloong-kernel
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          # 非定时触发（手动 / API）一律直接构建
          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "触发方式=${GITHUB_EVENT_NAME}（非定时），直接执行构建。"
            echo "build=true" >> "${GITHUB_OUTPUT}"
            echo "kernel=" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          kr_line="${{ inputs.armbian_kernel || '6.18.y' }}"
          kr_line="${kr_line%%_*}"
          verpatch="$(echo "${kr_line}" | awk -F. '{print $1"."$2}')"
          kernel_repo="${{ inputs.kernel_repo || 'Woloong-DS/Woloong-kernel' }}"
          kernel_usage="${{ inputs.kernel_usage || 'stable' }}"
          image_repo="${{ github.repository }}"
          # 1) 内核仓库当前可用的最新补丁版本（读 expanded_assets 页面，不受 API 限流影响）
          need="$(curl -fsSL "https://github.com/${kernel_repo}/releases/expanded_assets/kernel_${kernel_usage}" \
                  | grep -oP "${verpatch}\.[0-9]+(?=\.tar\.gz)" | sort -urV | head -n 1)"
          # 2) 上次镜像构建所用的内核版本（从镜像 Release 资产名解析，排除 -trunk_ 基础镜像）
          have="$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${image_repo}/releases?per_page=10" \
                  | grep -oP 'Armbian_[^"]*\.img\.gz' | grep -v -- '-trunk_' \
                  | grep -oP "${verpatch}\.[0-9]+" | sort -urV | head -n 1)"
          echo "内核仓库最新: [ ${need:-无} ] | 上次镜像内核: [ ${have:-无} ]"
          if [[ -z "${need}" ]]; then
            echo "内核仓库里没有 ${verpatch}.x，跳过镜像编译。"
            echo "build=false" >> "${GITHUB_OUTPUT}"
          elif [[ "${need}" == "${have}" ]]; then
            echo "已是最新内核 ${have}，跳过镜像编译。"
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "检测到新内核：${have:-无} → ${need}，开始镜像编译。"
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "kernel=${need}" >> "${GITHUB_OUTPUT}"
  setup:
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix based on set_release input
        id: set-matrix
        run: |
          if [[ "${{ inputs.set_release || 'bookworm' }}" == "all" ]]; then
            MATRIX='{"include":[{"release":"trixie"},{"release":"bookworm"},{"release":"resolute"},{"release":"noble"}]}'
          else
            MATRIX='{"include":[{"release":"${{ inputs.set_release || 'bookworm' }}"}]}'
          fi
          echo "matrix=${MATRIX}" >> "${GITHUB_OUTPUT}"

  build:
    needs: setup
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event_name == 'schedule' || github.event.repository.owner.id == github.event.sender.id }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    name: build-armbian-${{ matrix.release }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Woloong overlay in action checkout  # 早期校验：缺 overlay 立即失败，避免白跑编译
        run: |
          set -o pipefail
          action_dir="$(ls -d /home/runner/work/_actions/${{ github.repository }}/*/ 2>/dev/null | head -n 1 || true)"
          if [[ -z "${action_dir}" ]]; then
            action_dir="$(ls -d /home/runner/work/_actions/*/amlogic-s9xxx-armbian/*/ 2>/dev/null | head -n 1 || true)"
          fi
          if [[ -z "${action_dir}" ]]; then
            echo "::warning::action 目录尚未就绪，跳过 overlay 校验（不影响构建）。"
            exit 0
          fi
          echo "action 目录: ${action_dir}"
          missing=0
          for rel in \
            "build-armbian/armbian-files/common-files/etc/default/armbian-motd" \
            "build-armbian/armbian-files/common-files/etc/apt/apt.conf.d/99-woloong-branding" \
            "build-armbian/armbian-files/common-files/usr/local/bin/woloong-motd-fix" ; do
            if [[ -f "${action_dir}${rel}" ]]; then
              echo "OK   ${rel}"
            else
              echo "::error::action 仓库中缺少 ${rel}"
              missing=$((missing + 1))
            fi
          done
          if [[ -f "${action_dir}build-armbian/armbian-files/common-files/etc/default/armbian-motd" ]]; then
            echo "overlay: $(grep '^VENDOR=' "${action_dir}build-armbian/armbian-files/common-files/etc/default/armbian-motd" 2>/dev/null)"
          fi
          [[ "${missing}" -eq 0 ]] || exit 1

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo apt-get -y update
          sudo apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-build-armbian-depends)
          sudo systemctl daemon-reload
          #sudo apt-get -y full-upgrade
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        id: disk
        run: |
          # Get available space in exact GB
          root_avail=$(df --block-size=1G / | tail -1 | awk '{print $4}')
          root_size=$(( root_avail - 4 ))
          [[ "${root_size}" -gt 0 ]] || { echo "Error: Insufficient space on /: ${root_avail}G available"; exit 1; }

          sudo truncate -s "${root_size}"G /root.img
          build_dev=$(sudo losetup --find --show /root.img)
          echo "Using /: ${root_size}G"

          sudo mkfs.xfs -f -i sparse=0 -b size=4096 "${build_dev}"
          sudo mkdir -p /builder
          sudo mount "${build_dev}" /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Download Armbian source code
        id: down
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          df -hT ${PWD}
          git clone -q --single-branch --depth=1 --branch=main https://github.com/armbian/build.git build
          ln -sf /builder/build ${{ github.workspace }}/build
          # 把 action 检出目录里的 build 也软链到虚拟盘（动态定位，兼容 uses: 指向本仓库的情况）
          action_ref_dir="$(ls -d /home/runner/work/_actions/${{ github.repository }}/*/ 2>/dev/null | head -n 1 || true)"
          if [[ -z "${action_ref_dir}" ]]; then
            action_ref_dir="$(ls -d /home/runner/work/_actions/*/amlogic-s9xxx-armbian/*/ 2>/dev/null | head -n 1 || true)"
          fi
          if [[ -z "${action_ref_dir}" ]]; then
            echo "::error::未找到 action 检出目录（/home/runner/work/_actions），无法为 rebuild 建立 build 软链"
            ls -d /home/runner/work/_actions/* 2>/dev/null || true
            exit 1
          fi
          ln -sfn /builder/build "${action_ref_dir}build"
          echo "action 侧软链: ${action_ref_dir}build -> /builder/build"
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Compile Armbian [ ${{ matrix.release }} ]
        id: compile
        working-directory: /builder
        if: ${{ steps.down.outputs.status == 'success' && !cancelled() }}
        run: |
          # Enable QEMU emulation for ARM cross-compilation
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes 2>/dev/null || true

          # Set the board name for the base Armbian image
          config_board="${{ inputs.config_board || 'odroidn2' }}"
          [[ -z "${config_board}" ]] && config_board="odroidn2"

          # Compile options reference: https://docs.armbian.com/Developer-Guide_Build-Options
          # 补回扩展目录（官方新版移除了这行，compile.sh 会为此发警告）
          mkdir -p /builder/build/userpatches/extensions

          cd build/
              ./compile.sh RELEASE=${{ matrix.release }} BOARD=${config_board} BRANCH=current BUILD_MINIMAL=no \
                           BUILD_ONLY=default HOST=armbian BUILD_DESKTOP=no EXPERT=yes KERNEL_CONFIGURE=no \
                           COMPRESS_OUTPUTIMAGE="sha" SHARE_LOG=yes

          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Organize output files and reclaim disk space
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          # Extract essential artifacts and remove build files
          chmod +x ${ROOTFS_SCRIPT}
          ${ROOTFS_SCRIPT} -v ${{ matrix.release }} -s true -c true -k true -p arm64

          # Remove build files while preserving output
          cd build/
          rm -rf $(ls . | grep -v "^output$" | xargs) 2>/dev/null

          # Display disk usage after cleanup
          df -hT ${PWD}
          echo "build_tag=Armbian_${{ matrix.release }}_arm64_${{ inputs.armbian_edition || 'server' }}_$(date +"%Y.%m")" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload Armbian image to Release
        uses: ophub/upload-to-releases@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: build/output/images/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Rebuild Armbian for target boards
        uses: Woloong-DS/Woloong-amlogic-s9xxx-armbian@main
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          build_target: armbian
          armbian_path: build/output/images/*.img.gz
          armbian_board: ${{ inputs.armbian_board || 's905x3-hk1' }}
          armbian_kernel: ${{ inputs.armbian_kernel || '6.18.y' }}
          auto_kernel: true
          kernel_repo: ${{ inputs.kernel_repo || 'Woloong-DS/Woloong-kernel' }}
          kernel_usage: ${{ inputs.kernel_usage || 'stable' }}
          armbian_fstype: ${{ inputs.armbian_fstype || 'ext4' }}
          builder_name: ${{ inputs.builder_name || 'woloong' }}

      - name: Upload rebuilt images to Release
        uses: ophub/upload-to-releases@main
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allow_updates: true
          remove_artifacts: false
          replaces_artifacts: true
          make_latest: true
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ### Armbian Image Information
            - Default username: `root`
            - Default password: `1234`
            - Install command: `armbian-install`
            - Update command: `armbian-update`
            ### Applicable Platform
            - 🐧 `arm64`
            - 🐋 Docker image: https://hub.docker.com/u/ophub
